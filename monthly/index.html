<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Voting App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>

            <h1>📦 Mini Voting App</h1>

            <p>
                What should we build next? 🚀
            </p>

        </header>


        <section class="candidates">


            <div class="card">

                <div class="emoji">
                    🎮
                </div>

                <h2>Mini Game</h2>

                <p>
                    Votes:
                    <span id="javascriptVotes">0</span>
                </p>

                <button id="javascriptBtn">
                    Vote 🎮
                </button>

            </div>


            <div class="card">

                <div class="emoji">
                    🛒
                </div>

                <h2>Mini Store</h2>

                <p>
                    Votes:
                    <span id="pythonVotes">0</span>
                </p>

                <button id="pythonBtn">
                    Vote 🛒
                </button>

            </div>


            <div class="card">

                <div class="emoji">
                    📝
                </div>

                <h2>To-Do App</h2>

                <p>
                    Votes:
                    <span id="phpVotes">0</span>
                </p>

                <button id="phpBtn">
                    Vote 📝
                </button>

            </div>


            <div class="card">

                <div class="emoji">
                    🧠
                </div>

                <h2>Quiz App</h2>

                <p>
                    Votes:
                    <span id="javaVotes">0</span>
                </p>

                <button id="javaBtn">
                    Vote 🧠
                </button>

            </div>


        </section>


        <section class="result">

            <h2>
                Total Votes:
                <span id="totalVotes">0</span>
            </h2>


            <div class="message-box">

                <p id="message">
                    Pilih aplikasi favoritmu!
                </p>

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
